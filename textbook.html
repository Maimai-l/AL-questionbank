<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAIE 教材</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{--bg:#f7f7f6;--panel:#fff;--sunk:#f2f3f5;--line:#dde0e4;--line-soft:#ecedef;
      --ink:#15181d;--dim:#69707c;--accent:#1f4fd8;--accent-bg:#eef2fd;--r:3px}
@media (prefers-color-scheme:dark){
  :root{--bg:#111316;--panel:#181b1f;--sunk:#14171a;--line:#2a2f36;--line-soft:#22262c;
        --ink:#e5e8ec;--dim:#959daa;--accent:#7ea3ff;--accent-bg:#1a2130}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,sans-serif}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 16px}
header h1{font-size:14px;font-weight:650;margin:0;white-space:nowrap}
header a{color:var(--dim);font-size:13px;text-decoration:none}
header a:hover{color:var(--accent)}
.spacer{flex:1}
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;max-width:1200px;margin:0 auto;padding:14px;align-items:start}
aside{position:sticky;top:57px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;max-height:calc(100vh - 72px);overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px}
select{width:100%;padding:5px 7px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r);font:inherit;font-size:13px;color:inherit}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:650;margin:14px 0 6px}
.chapters{margin:0 -12px}
.chapter{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid transparent;padding:6px 12px;font:inherit;font-size:13.5px;line-height:1.45;
  color:var(--ink);cursor:pointer}
.chapter:hover{background:var(--sunk)}
.chapter.on{background:var(--accent-bg);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.chapter i{font-style:normal;color:var(--dim);font-size:12px;min-width:18px;text-align:right}
.chapter.on i{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
h2{font-size:20px;line-height:1.35;margin:0;font-weight:650}
.pill{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:1px 6px;
  font-size:12px;color:var(--dim);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 12px;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.book{overflow-x:auto;line-height:1.8}
.book>:first-child{margin-top:0}
.book h1{font-size:18px}.book h2{font-size:16px}.book h3,.book h4{font-size:15px}
.book h1,.book h2{margin:1.3em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line-soft)}
.book h3,.book h4{margin:1.2em 0 .4em}
.book p{margin:.7em 0}
.book ul,.book ol{margin:.7em 0;padding-left:1.5em}
.book img{max-width:100%;background:#fff;border:1px solid var(--line)}
.book code{background:var(--sunk);padding:1px 4px;border-radius:2px;font-size:.9em}
.book table{border-collapse:collapse;margin:9px 0;font-size:13px}
.book th,.book td{border:1px solid var(--line);padding:4px 9px;text-align:center;white-space:nowrap}
.book th{background:var(--sunk);font-weight:600}
.empty{color:var(--dim);text-align:center;padding:60px 20px}
@media(max-width:820px){
  main{grid-template-columns:minmax(0,1fr);padding:10px;gap:10px}
  aside{position:static;max-height:none}
}
</style>
</head>
<body>
<header>
  <h1>CAIE 教材</h1>
  <span id="count" style="color:var(--dim);font-size:13px"></span>
  <span class="spacer"></span>
  <a href="practice.html">刷题 →</a>
</header>
<main>
  <aside id="side"></aside>
  <section id="view"></section>
</main>

<script src="textbooks.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script>
if (!window.katex) {
  document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">');
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/scr'+'ipt>');
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/scr'+'ipt>');
}
</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHAPTERS = (window.TEXTBOOKS||[]).map(c => ({...c, s: c.s || c.syllabus}));
/* 标题里常带着自己的序号("1 Quadratics"),列表左边已经有序号了 */
const cleanTitle = c => String(c.title||c.id||"").replace(/^\s*\d+[.、\s]\s*/, "");

const RULE = /^\s*\|[\s|:-]+\|\s*$/, isRow = l => /^\s*\|.*\|\s*$/.test(l);
const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
function chapterHtml(c){
  const src = String(c.content||"").replace(/<!--[\s\S]*?-->/g,"");
  return src.split(/\n\s*\n/).map(b=>{
    if (/^\s*</.test(b)) return b.replace(/<img[^>]*>/g, "");     // 教材插图不显示也不导出
    const h = b.match(/^(#{1,4})\s+(.+)$/);
    if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    const lines = b.split("\n").filter(l=>l.trim());
    if (!lines.length) return "";
    if (lines.every(isRow)){
      const rows = lines.filter(l=>!RULE.test(l))
        .map(l=>l.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));
      return `<table>` + rows.map((r,ri)=>`<tr>` +
        r.map(x=>`<${ri?"td":"th"}>${esc(x)}</${ri?"td":"th"}>`).join("") + `</tr>`).join("") + `</table>`;
    }
    if (lines.every(l=>/^\s*([-*•]|\d+[.)])\s+/.test(l))){
      const ol = /^\s*\d/.test(lines[0]);
      return `<${ol?"ol":"ul"}>`+lines.map(l=>`<li>${inline(l.replace(/^\s*([-*•]|\d+[.)])\s+/,""))}</li>`).join("")+`</${ol?"ol":"ul"}>`;
    }
    return `<p>${inline(b).replace(/\n/g,"<br>")}</p>`;
  }).join("");
}
function typeset(node){
  if (!window.renderMathInElement || !node) return;
  try { renderMathInElement(node, {delimiters:[
    {left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},
    {left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}], throwOnError:false}); } catch(e){}
}

let curBook = "", cur = null;
const key = c => c.s + " · " + c.book;
const books = () => [...new Set(CHAPTERS.map(key))];
const chaptersOf = k => CHAPTERS.filter(c => key(c) === k);

function markdown(c){
  const body = String(c.content||"").replace(/<!--[\s\S]*?-->/g,"")
                                    .replace(/<img[^>]*>/g, "").trim();
  return `# ${c.book} 第 ${c.chapter_no} 章 ${cleanTitle(c)}\n\n`
       + `> ${c.s} 大纲主题 ${c.topic||"—"}${c.topic_name?" "+c.topic_name:""}\n\n`
       + body + "\n";
}
function download(){
  const name = `${cur.s}-${cur.chapter_no}-${cleanTitle(cur)}`.replace(/[\/\\:*?"<>|]/g,"-");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([markdown(cur)], {type:"text/markdown;charset=utf-8"}));
  a.download = name + ".md"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function draw(){
  const ks = books();
  if (!ks.length){
    $("side").innerHTML = "";
    $("view").innerHTML = `<div class="panel empty">没读到教材数据。<br>
      把 <code>textbooks.js</code> 和这个 html 放在同一个文件夹里。</div>`;
    return;
  }
  if (!ks.includes(curBook)) curBook = ks[0];
  const list = chaptersOf(curBook);
  if (!list.includes(cur)) cur = list[0];

  $("count").textContent = `${CHAPTERS.length} 章`;
  $("side").innerHTML = `<select id="bookSel">${ks.map(k=>
      `<option ${k===curBook?"selected":""}>${esc(k)}</option>`).join("")}</select>
    <p class="label">章节 · ${list.length}</p>
    <div class="chapters">${list.map(c=>`
      <button class="chapter ${c===cur?"on":""}" data-id="${esc(c.id)}">
        <i>${esc(c.chapter_no)}</i><span>${esc(cleanTitle(c))}</span></button>`).join("")}</div>`;
  $("bookSel").onchange = () => { curBook = $("bookSel").value; cur = chaptersOf(curBook)[0]; draw(); };
  $("side").querySelectorAll(".chapter").forEach(b => b.onclick = () => {
    cur = CHAPTERS.find(c => c.id === b.dataset.id); draw(); window.scrollTo({top:0});
  });

  const i = list.indexOf(cur);
  $("view").innerHTML = `<article class="panel">
    <div class="top">
      <h2>第 ${esc(cur.chapter_no)} 章 ${esc(cleanTitle(cur))}</h2>
      <span class="pill">${esc(cur.s)}</span>
      ${cur.topic?`<span class="pill">${esc(cur.topic)} ${esc(cur.topic_name||"")}</span>`:""}
      <span class="spacer"></span>
      <button class="btn" id="prev" ${i<=0?"disabled":""}>←</button>
      <button class="btn" id="next" ${i>=list.length-1?"disabled":""}>→</button>
      <button class="btn primary" id="dl">导出这一章 .md</button>
    </div>
    <div class="book" id="content">${chapterHtml(cur)}</div>
  </article>`;
  $("prev").onclick = () => { cur = list[i-1]; draw(); window.scrollTo({top:0}); };
  $("next").onclick = () => { cur = list[i+1]; draw(); window.scrollTo({top:0}); };
  $("dl").onclick = download;
  typeset($("content"));
}
draw();
window.addEventListener("load", () => setTimeout(() => typeset(document.body), 300));
</script>
</body>
</html>
