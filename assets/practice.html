<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAIE 刷题 · 9709 / 9231 / 9618</title>
<!-- KaTeX ships in vendor/ so the page works with no network at all; the CDN
     is only a fallback for when this file is moved away from that folder. -->
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1a1d21; --dim:#6b7280;
  --accent:#2f6fed; --good:#12855f; --mid:#b8860b; --bad:#c0392b; --soft:#eef2ff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171b;--card:#1c2026;--line:#2c323a;--ink:#e6e9ee;--dim:#9aa3af;
        --soft:#22293a;}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
     background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.3px}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid transparent;background:none;color:var(--dim);padding:5px 12px;
             border-radius:7px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--soft);color:var(--accent);border-color:var(--line);font-weight:600}
.spacer{flex:1}
.count{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:250px 1fr;gap:18px;padding:18px;align-items:start;
     max-width:1500px;margin:0 auto}
main.nofilter{grid-template-columns:1fr}
@media(max-width:860px){main{grid-template-columns:1fr}aside{position:static!important}}
aside{position:sticky;top:60px;background:var(--card);border:1px solid var(--line);
      border-radius:12px;padding:14px}
aside h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.5px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
select,input[type=text],input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);color:var(--ink);font-size:13px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:5px 0;color:var(--ink);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;
  font-size:14px;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim);margin-bottom:12px}
.pill{border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--bg)}
.pill.tag{background:var(--soft);color:var(--accent);border-color:transparent}
.pill.warn{background:#fff4e5;color:#a35b00;border-color:transparent}
@media (prefers-color-scheme:dark){.pill.warn{background:#3a2c15;color:#e8b464}}
.qimg{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.qtext{white-space:pre-wrap;font-size:15px;line-height:1.75;overflow-x:auto}
.ms{font-size:13px;line-height:1.7;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:12px;overflow-x:auto}
.ms .qtext{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
table.grid{border-collapse:collapse;margin:10px 0;width:auto;font-size:13px}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 10px;text-align:center;
  white-space:nowrap}
table.grid th{background:var(--soft);font-weight:600}
.viewsw{display:flex;gap:4px;margin-bottom:10px}
.viewsw button{font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);
               background:var(--bg);color:var(--dim);cursor:pointer}
.viewsw button.on{background:var(--soft);color:var(--accent);border-color:transparent;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;
     padding-top:14px;border-top:1px solid var(--line)}
.grade{display:flex;gap:6px}
.grade button{border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--card);
              cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink)}
.grade button[data-g=good]:hover,.grade button[data-g=good].on{background:var(--good);color:#fff;border-color:var(--good)}
.grade button[data-g=ok]:hover,.grade button[data-g=ok].on{background:var(--mid);color:#fff;border-color:var(--mid)}
.grade button[data-g=bad]:hover,.grade button[data-g=bad].on{background:var(--bad);color:#fff;border-color:var(--bad)}
.kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;
     border-radius:4px;padding:1px 5px;color:var(--dim)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:70px}
.mini i{display:block;height:100%;background:var(--good)}
.empty{color:var(--dim);text-align:center;padding:60px 20px}
a{color:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
details.msbox summary{cursor:pointer;color:var(--accent);font-size:14px;margin-bottom:8px;user-select:none}
.katex{font-size:1.02em}
.imgwrap{position:relative}
.figimg{max-width:72%;display:block;margin:8px auto;background:#fff;
  border:1px solid var(--line);border-radius:6px}
.mcq{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center}
.mcq button{min-width:42px;padding:8px 0;font-weight:600;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);cursor:pointer}
.mcq button.right{background:#16a34a;color:#fff;border-color:#16a34a}
.mcq button.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
.mcqmsg{font-size:13px;color:var(--dim)}
.imgfail{display:none;padding:14px;border:1px dashed var(--line);border-radius:8px;
         color:var(--dim);font-size:13px}
@media print{
  header,aside,.bar,.viewsw,.noprint{display:none!important}
  main{display:block;padding:0;max-width:none}
  .card{border:none;padding:0 0 22px;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <h1>CAIE 刷题</h1>
  <div class="tabs" id="tabs">
    <button data-v="drill" class="on">刷题</button>
    <button data-v="paper">组卷</button>
    <button data-v="stats">统计</button>
  </div>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
  <button class="btn" id="exportBtn" title="导出做题记录">导出记录</button>
  <label class="btn" style="position:relative;overflow:hidden">导入记录
    <input type="file" id="importFile" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer">
  </label>
</header>

<main>
<aside id="side">
  <h3>筛选</h3>
  <div class="f"><label>科目</label><select id="fSyl"></select></div>
  <div class="f"><label>试卷</label><select id="fComp"></select></div>
  <div class="f"><label>主题</label><select id="fTopic"></select></div>
  <div class="f"><label>分值</label><div class="row2">
    <input type="number" id="fMinM" placeholder="最低" min="1"><input type="number" id="fMaxM" placeholder="最高" min="1">
  </div></div>
  <div class="f"><label>年份</label><div class="row2">
    <input type="number" id="fY0" placeholder="从" min="2021" max="2025"><input type="number" id="fY1" placeholder="到" min="2021" max="2025">
  </div></div>
  <div class="f"><label>搜索题面</label><input type="text" id="fText" placeholder="如 binomial / stack"></div>
  <div class="f"><label>状态</label><select id="fState">
    <option value="">全部</option><option value="new">没做过</option>
    <option value="bad">不会 / 错题本</option><option value="ok">一般</option>
    <option value="good">已掌握</option><option value="done">做过的</option>
  </select></div>
  <label class="chk"><input type="checkbox" id="fMs" checked>只看有答案的</label>
  <label class="chk"><input type="checkbox" id="fClean">只看文字干净的</label>
  <label class="chk"><input type="checkbox" id="fDia">只看带图的</label>
  <label class="chk"><input type="checkbox" id="fShuffle" checked>乱序</label>
  <div class="bar" style="border:none;padding-top:6px">
    <button class="btn" id="reset" style="flex:1">重置</button>
  </div>
</aside>

<section id="view"></section>
</main>

<script src="data.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script>
// vendor/ missing (page moved on its own)? pull KaTeX from the CDN instead.
if (!window.katex) {
  document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">');
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/scr'+'ipt>');
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/scr'+'ipt>');
}
</script>
<script>
"use strict";
const QB = window.QB || [];

/* ---------------------------------------------------------- progress ----
   Kept in localStorage, with a hand export/import so the record survives a
   browser wipe or a move to another machine. Every access is guarded: a page
   opened from file:// in a locked-down browser has no storage, and losing the
   whole app over that would be silly. */
const KEY = "caie-progress-v1";
let PROG = {};
try { PROG = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { PROG = {}; }
function saveProg(){ try{ localStorage.setItem(KEY, JSON.stringify(PROG)); }catch(e){} }

/* ------------------------------------------------------------- images ----
   The crops sit in img9709/ img9231/ img9618/ next to this file, but the
   folder may equally be one level up if the page was dropped inside qb/.
   Try each candidate in turn rather than making the user rearrange folders. */
const IMG_ROOTS = ["", "../", "./images/", "../images/"];
function mountImg(el, rel){
  let i = 0;
  el.onerror = () => {
    if (++i < IMG_ROOTS.length) el.src = IMG_ROOTS[i] + rel;
    else { el.style.display = "none";
           el.parentElement.querySelector(".imgfail").style.display = "block"; };
  };
  el.src = IMG_ROOTS[0] + rel;
}

/* --------------------------------------------------------------- latex ----
   Rendering is best-effort. Without a network the KaTeX script never loads,
   and the raw "$ x^{2} $" is still perfectly readable — so never block on it. */
function typeset(node){
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(node, {
      delimiters:[{left:"$$",right:"$$",display:true},
                  {left:"\\[",right:"\\]",display:true},
                  {left:"$",right:"$",display:false},
                  {left:"\\(",right:"\\)",display:false}],
      throwOnError:false
    });
  } catch(e){}
}

const esc = s => (s==null?"":String(s)).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* Truth tables, trace tables and frequency tables are stored as pipe tables.
   Left as text they wrap into mush at any narrow width, so draw them. */
const RULE = /^\s*\|[\s|:-]+\|\s*$/;
const isRow = l => /^\s*\|.*\|\s*$/.test(l);
function richText(src){
  const lines = String(src || "").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++){
    const im = lines[i].trim().match(/^!\[\]\((\S+)\)$/);
    if (im){ out.push({t:"img", v:im[1]}); continue; }
    if (!isRow(lines[i])) { out.push({t:"p", v:lines[i]}); continue; }
    const rows = [];
    while (i < lines.length && isRow(lines[i])){
      if (!RULE.test(lines[i]))
        rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c=>c.trim()));
      i++;
    }
    i--;
    out.push({t:"table", v:rows});
  }
  let html = "", buf = [];
  const flush = () => { if (buf.length){ html += `<div class="qtext">${esc(buf.join("\n"))}</div>`; buf = []; } };
  for (const b of out){
    if (b.t === "p") buf.push(b.v);
    else if (b.t === "img"){
      // inline figure from the OCR (TSA/BMAT charts, TMUA option sketches)
      flush();
      html += `<img class="figimg" src="${esc(b.v)}" `+
              `onerror="this.style.display='none'">`;
    }
    else {
      flush();
      html += `<table class="grid">` + b.v.map((r,ri)=>`<tr>` +
        r.map(c=>`<${ri?"td":"th"}>${esc(c)}</${ri?"td":"th"}>`).join("") + `</tr>`).join("") + `</table>`;
    }
  }
  flush();
  return html;
}

/* -------------------------------------------------------------- filters --- */
const $ = id => document.getElementById(id);
const F = {};
function readFilters(){
  F.syl=$("fSyl").value; F.comp=$("fComp").value; F.topic=$("fTopic").value;
  F.minM=+$("fMinM").value||0; F.maxM=+$("fMaxM").value||0;
  F.y0=+$("fY0").value||0; F.y1=+$("fY1").value||0;
  F.text=$("fText").value.trim().toLowerCase();
  F.state=$("fState").value;
  F.ms=$("fMs").checked; F.clean=$("fClean").checked;
  F.dia=$("fDia").checked; F.shuffle=$("fShuffle").checked;
}
function match(q){
  if (F.syl && q.s !== F.syl) return false;
  if (F.comp && q.c !== F.comp) return false;
  if (F.topic && q.t !== F.topic) return false;
  if (F.minM && !(q.m >= F.minM)) return false;
  if (F.maxM && !(q.m <= F.maxM)) return false;
  if (F.y0 && q.y < F.y0) return false;
  if (F.y1 && q.y > F.y1) return false;
  if (F.ms && !q.ms) return false;
  if (F.clean && q.qq !== "ok") return false;
  if (F.dia && !q.dia) return false;
  if (F.text){
    const hay = ((q.qt||"") + " " + (q.tn||"") + " " + q.id).toLowerCase();
    if (!hay.includes(F.text)) return false;
  }
  if (F.state){
    const g = PROG[q.id] && PROG[q.id].g;
    if (F.state === "new"  && g) return false;
    if (F.state === "done" && !g) return false;
    if (["good","ok","bad"].includes(F.state) && g !== F.state) return false;
  }
  return true;
}
/* Deterministic shuffle keyed on the id, so the "random" order is stable
   across a reload — otherwise pressing next after a refresh replays questions. */
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
let SEED = 1;
function pool(){
  const out = QB.filter(match);
  if (F.shuffle) out.sort((a,b)=>hash(a.id+SEED)-hash(b.id+SEED));
  else out.sort((a,b)=> a.s.localeCompare(b.s)||a.ser.localeCompare(b.ser)||a.p.localeCompare(b.p)||a.q-b.q);
  return out;
}

/* -------------------------------------------------------------- render --- */
function metaHtml(q){
  const bits = [
    `<span class="pill">${esc(q.p)} ${esc(q.ses)}</span>`,
    `<span class="pill">Q${q.q}</span>`,
    q.m ? `<span class="pill">${q.m} 分</span>` : "",
    q.tn ? `<span class="pill tag">${esc(q.t)} ${esc(q.tn)}</span>` : "",
    q.st ? `<span class="pill">${esc(q.st)} ${esc(q.stn || "")}</span>` : "",
    q.dia ? `<span class="pill">含图</span>` : "",
  ];
  if (q.qq === "partial") bits.push(`<span class="pill warn">文字版不完整 · 以原题图为准</span>`);
  if (q.qq === "missing")  bits.push(`<span class="pill warn">无文字版 · 看原题图</span>`);
  if (!q.ms)               bits.push(`<span class="pill warn">此题无公布答案</span>`);
  if (q.tsrc !== "model" && q.tmar === 0) bits.push(`<span class="pill warn">主题标签存疑</span>`);
  bits.push(`<span class="pill">${esc(q.id)}</span>`);
  return `<div class="meta">${bits.join("")}</div>`;
}
function cardHtml(q, opts){
  opts = opts || {};
  const g = (PROG[q.id]||{}).g;
  // MCQ (TMUA/TSA/BMAT): letter buttons that check against the key.
  const isMcq = q.qty === "mcq" && /^[A-H]$/.test(q.ans || "");
  const letters = isMcq
    ? (q.opt && q.opt.length ? q.opt : "ABCDE".split("")) : [];
  return `
  <div class="card" data-id="${esc(q.id)}">
    ${metaHtml(q)}
    ${q.img ? `<div class="viewsw noprint">
      <button data-mode="img" class="on">原题图</button>
      <button data-mode="txt">文字版</button>
    </div>` : ""}
    <div class="body">
      <div class="imgwrap pane-img"${q.img ? "" : ` style="display:none"`}>
        <img class="qimg" alt="${esc(q.id)}">
        <div class="imgfail">找不到题图 <code>${esc(q.img)}</code> —
          把 img9709 / img9231 / img9618 / img_adm 这些图片文件夹放到这个 html 旁边就能显示。下面切到“文字版”一样能做。</div>
      </div>
      <div class="pane-txt"${q.img ? ` style="display:none"` : ""}>${richText(q.qt || "(无文字版)")}</div>
    </div>
    ${isMcq ? `<div class="mcq noprint"><span style="font-size:13px;color:var(--dim)">选答案：</span>` +
        letters.map(L=>`<button data-pick="${L}">${L}</button>`).join("") +
        `<span class="mcqmsg"></span></div>` : ""}
    ${q.ms ? `<details class="msbox" ${opts.openMs?"open":""}>
        <summary>显示答案 / Mark scheme${q.msq==="degraded"?"（排版有损，但内容可读）":""}</summary>
        <div class="ms">${richText(q.ms)}</div>
      </details>` : `<p style="color:var(--dim);font-size:13px">这一题 Cambridge 没有公布 mark scheme。</p>`}
    ${opts.noBar ? "" : `<div class="bar noprint">
      <div class="grade">
        <button data-g="good" class="${g==="good"?"on":""}">会了 <span class="kbd">1</span></button>
        <button data-g="ok"   class="${g==="ok"?"on":""}">一般 <span class="kbd">2</span></button>
        <button data-g="bad"  class="${g==="bad"?"on":""}">不会 <span class="kbd">3</span></button>
      </div>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" data-act="prev">← 上一题</button>
      <button class="btn primary" data-act="next">下一题 →</button>
    </div>`}
  </div>`;
}
function hydrate(root){
  root.querySelectorAll(".card").forEach(card => {
    const q = BY[card.dataset.id];
    const img = card.querySelector(".qimg");
    if (img && q.img) mountImg(img, q.img);
    card.querySelectorAll(".viewsw button").forEach(b => b.onclick = () => {
      card.querySelectorAll(".viewsw button").forEach(x=>x.classList.toggle("on", x===b));
      card.querySelector(".pane-img").style.display = b.dataset.mode==="img"?"":"none";
      card.querySelector(".pane-txt").style.display = b.dataset.mode==="txt"?"":"none";
    });
    card.querySelectorAll(".grade button").forEach(b => b.onclick = () => grade(q.id, b.dataset.g));
    card.querySelectorAll("[data-act]").forEach(b => b.onclick = () => step(b.dataset.act==="next"?1:-1));
    card.querySelectorAll(".mcq button").forEach(b => b.onclick = () => {
      const pick = b.dataset.pick, right = pick === q.ans;
      card.querySelectorAll(".mcq button").forEach(x => {
        x.classList.toggle("right", x.dataset.pick === q.ans);
        x.classList.toggle("wrong", x === b && !right);
      });
      card.querySelector(".mcqmsg").textContent =
        right ? "✓ 对了" : `✗ 正确答案是 ${q.ans}`;
      const det = card.querySelector("details.msbox");
      if (det) det.open = true;               // show the explanation
      gradeQuiet(q.id, right ? "good" : "bad"); // record, don't auto-advance
    });
  });
  typeset(root);
}
const BY = {}; QB.forEach(q => BY[q.id] = q);

/* --------------------------------------------------------------- drill --- */
let LIST = [], IDX = 0;
function gradeQuiet(id, g){
  const p = PROG[id] || (PROG[id] = {n:0});
  p.g = g; p.n = (p.n||0)+1; p.at = new Date().toISOString().slice(0,10);
  saveProg();
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) card.querySelectorAll(".grade button")
      .forEach(b => b.classList.toggle("on", b.dataset.g === g));
}
function grade(id, g){
  gradeQuiet(id, g);
  setTimeout(()=>step(1), 180);
}
function step(d){
  if (!LIST.length) return;
  IDX = (IDX + d + LIST.length) % LIST.length;
  drawDrill();
  window.scrollTo({top:0, behavior:"smooth"});
}
function drawDrill(){
  const v = $("view");
  if (!LIST.length){ v.innerHTML = `<div class="card empty">没有符合条件的题目，放宽左边的筛选试试。</div>`;
                     $("count").textContent = "0 题"; return; }
  IDX = Math.min(IDX, LIST.length-1);
  $("count").textContent = `${IDX+1} / ${LIST.length} 题`;
  v.innerHTML = cardHtml(LIST[IDX], {});
  hydrate(v);
}

/* --------------------------------------------------------------- paper --- */
const TOTAL = {"9709":{"1":75,"3":75,"4":50,"5":50},
               "9231":{"1":75,"2":75,"3":50,"4":50},
               "9618":{"1":75,"2":75,"3":75,"4":75}};
const DURATION = {75:110, 50:75};   // minutes, per the CAIE timetable
let paperState = null, tick = null;

function buildPaper(syl, comp, excludeYear){
  const target = (TOTAL[syl]||{})[comp] || 75;
  const cand = QB.filter(q => q.s===syl && q.c===comp && q.m && q.ms &&
                             q.qq !== "missing" && (!excludeYear || q.y != excludeYear));
  const topics = [...new Set(cand.map(q=>q.t).filter(Boolean))].sort();
  const picked = [], seen = new Set();
  let used = 0;
  // one question per topic first, so the mock covers the syllabus rather than
  // three questions from whichever topic happens to be over-represented
  for (const t of topics){
    const want = Math.max(2, Math.round((target-used)/Math.max(1, topics.length)));
    const opts = cand.filter(q => q.t===t && !seen.has(q.id) && used+q.m <= target)
                     .sort((a,b)=> Math.abs(a.m-want)-Math.abs(b.m-want) || Math.random()-.5);
    if (opts.length){ picked.push(opts[0]); seen.add(opts[0].id); used += opts[0].m; }
  }
  // top up to the official total with the largest questions that still fit
  let guard = 0;
  while (used < target && picked.length < 16 && guard++ < 60){
    const opts = cand.filter(q => !seen.has(q.id) && used+q.m <= target)
                     .sort((a,b)=> b.m-a.m || Math.random()-.5);
    if (!opts.length) break;
    picked.push(opts[0]); seen.add(opts[0].id); used += opts[0].m;
  }
  picked.sort((a,b)=> a.m-b.m);
  return {syl, comp, target, used, qs:picked};
}
function fmt(s){ const m=Math.floor(s/60), x=s%60; return `${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`; }
const paperSel = {syl:"9709", comp:"1", ex:""};
function drawPaper(){
  const v = $("view");
  const p = paperState;
  if (!TOTAL[paperSel.syl][paperSel.comp]) paperSel.comp = Object.keys(TOTAL[paperSel.syl])[0];
  const sylOpts = ["9709","9231","9618"].map(s=>`<option ${paperSel.syl===s?"selected":""}>${s}</option>`).join("");
  const compOpts = Object.keys(TOTAL[paperSel.syl])
    .map(c=>`<option ${paperSel.comp===c?"selected":""}>${c}</option>`).join("");
  v.innerHTML = `
  <div class="card noprint">
    <div class="bar" style="border:none;padding-top:0;margin-top:0">
      <label>科目 <select id="pSyl" style="width:auto">${sylOpts}</select></label>
      <label>Paper <select id="pComp" style="width:auto">${compOpts}</select></label>
      <label>留出年份 <select id="pEx" style="width:auto">
        <option value="">不留</option>${[2021,2022,2023,2024,2025].map(y=>`<option ${paperSel.ex==y?"selected":""}>${y}</option>`).join("")}
      </select></label>
      <button class="btn primary" id="pGo">生成一套</button>
      ${p?`<span class="spacer" style="flex:1"></span>
        <span class="timer" id="clock">${fmt(p.left)}</span>
        <button class="btn" id="pTimer">${p.running?"暂停":"开始计时"}</button>
        <button class="btn" id="pShow">${p.showMs?"收起答案":"显示全部答案"}</button>
        <button class="btn" onclick="window.print()">打印</button>`:""}
    </div>
    ${p?`<div style="color:var(--dim);font-size:13px;margin-top:10px">
      ${p.syl}/${p.comp} · 共 ${p.used} 分（官方 ${p.target} 分）· ${p.qs.length} 题 ·
      建议 ${DURATION[p.target]||110} 分钟${p.ex?` · 已留出 ${p.ex} 年真题`:""}</div>`:""}
  </div>
  ${p ? `<div class="card" style="text-align:center">
      <div style="font-weight:650">${p.syl} ${p.qs[0]?esc(p.qs[0].cn):""} — 模拟卷</div>
      <div style="color:var(--dim);font-size:13px">${p.used} 分 · ${DURATION[p.target]||110} 分钟</div>
    </div>` + p.qs.map((q,i)=>cardHtml(q,{noBar:true, openMs:p.showMs})).join("")
    : `<div class="card empty">选好科目和 paper，点“生成一套”。<br>组卷会每个主题各抽一题，凑到该卷的官方总分。</div>`}`;

  $("pGo").onclick = () => {
    paperSel.syl = $("pSyl").value; paperSel.comp = $("pComp").value; paperSel.ex = $("pEx").value;
    const built = buildPaper(paperSel.syl, paperSel.comp, paperSel.ex);
    paperState = {...built, ex:paperSel.ex, left:(DURATION[built.target]||110)*60,
                  running:false, showMs:false};
    stopTick(); drawPaper();
  };
  $("pSyl").onchange = () => { paperSel.syl = $("pSyl").value; paperState = null; drawPaper(); };
  $("pComp").onchange = () => { paperSel.comp = $("pComp").value; };
  $("pEx").onchange = () => { paperSel.ex = $("pEx").value; };
  if (p){
    $("pShow").onclick = () => { paperState.showMs = !paperState.showMs; drawPaper(); };
    $("pTimer").onclick = () => { paperState.running = !paperState.running;
      paperState.running ? startTick() : stopTick(); drawPaper(); };
    if (p.running) startTick();
    hydrate(v);
  }
  $("count").textContent = p ? `${p.qs.length} 题 · ${p.used} 分` : "";
}
function startTick(){ stopTick(); tick = setInterval(()=>{
    if (!paperState) return stopTick();
    paperState.left = Math.max(0, paperState.left-1);
    const c = $("clock"); if (c) c.textContent = fmt(paperState.left);
    if (!paperState.left) stopTick();
  }, 1000); }
function stopTick(){ if (tick) clearInterval(tick); tick = null; }

/* --------------------------------------------------------------- stats --- */
/* A low score on a topic is ambiguous on its own. The syllabus says which
   topics assume which others, so if an upstream one is also weak, that is
   where the work actually needs to happen. */
const PRE = window.PRE || {};
function upstreamOf(syl, topic){
  return (PRE.topic_prerequisites || [])
    .filter(e => e.to === syl + ":" + topic).map(e => e.from);
}
function diagnose(row, all){
  const ups = upstreamOf(row.s, row.t);
  if (!ups.length) return "";
  const weak = ups.filter(u => {
    const [us, uc] = u.split(":");
    const r = all[us + "|" + uc];
    return r && r.rate < 0.6;
  });
  if (weak.length) return "先补 " + weak.map(u=>u.split(":")[1]).join(", ");
  const done = ups.some(u => all[u.replace(":", "|")]);
  return done ? "" : "先修 " + ups.map(u=>u.split(":")[1]).join(", ") + " 还没做过";
}

function drawStats(){
  const tally = {};
  QB.forEach(q => {
    const g = (PROG[q.id]||{}).g; if (!g) return;
    const k = q.s+"|"+(q.t||"?")+"|"+(q.tn||"");
    const r = tally[k] || (tally[k] = {good:0, ok:0, bad:0, n:0});
    r[g]++; r.n++;
  });
  const list = Object.entries(tally).map(([k,r]) => {
    const [s,t,tn] = k.split("|");
    return {s,t,tn,...r, rate: r.n ? r.good/r.n : 0};
  }).sort((a,b)=> a.rate-b.rate || b.n-a.n);
  const rows = {};                       // syllabus|topic -> row, for diagnose()
  list.forEach(r => rows[r.s + "|" + r.t] = r);
  const done = Object.values(PROG).filter(p=>p.g).length;
  const bad  = Object.values(PROG).filter(p=>p.g==="bad").length;

  $("view").innerHTML = `
  <div class="card">
    <div class="meta">
      <span class="pill">题库共 ${QB.length} 题</span>
      <span class="pill">已做 ${done}</span>
      <span class="pill">错题 ${bad}</span>
      <span class="pill">覆盖 ${(done/QB.length*100).toFixed(1)}%</span>
    </div>
    ${done? `<p style="color:var(--dim);font-size:13px;margin:0">按掌握率从低到高排。想专攻某一行，回“刷题”选那个主题，或把状态设成“不会”。</p>`
          : `<p style="color:var(--dim)">还没有做题记录。去“刷题”里给题目打个分，这里就会出现按主题的掌握情况。</p>`}
  </div>
  ${list.length? `<div class="card"><table>
    <tr><th>科目</th><th>主题</th><th class="num">做过</th><th class="num">会</th>
        <th class="num">一般</th><th class="num">不会</th><th>掌握率</th><th>诊断</th></tr>
    ${list.map(r=>`<tr>
      <td>${r.s}</td><td>${esc(r.t)} ${esc(r.tn)}</td>
      <td class="num">${r.n}</td><td class="num">${r.good}</td>
      <td class="num">${r.ok}</td><td class="num">${r.bad}</td>
      <td><div class="mini"><i style="width:${(r.rate*100).toFixed(0)}%"></i></div></td>
      <td style="font-size:12px;color:var(--dim)">${diagnose(r, rows)}</td>
    </tr>`).join("")}
  </table>
  <p style="color:var(--dim);font-size:12px;margin:10px 0 0">
    “先补”一列来自大纲写明的先修关系：掌握率低不一定是这个主题的问题，
    也可能是它假设你已经会的那个主题还没过关。</p>
  </div>`:""}
  <div class="card">
    <h3 style="margin-top:0;color:var(--dim);font-size:13px">题库覆盖</h3>
    <table><tr><th>科目</th><th>Paper</th><th class="num">题数</th><th class="num">有答案</th><th class="num">带图</th></tr>
    ${(()=>{const g={};QB.forEach(q=>{const k=q.s+"/"+q.c;(g[k]||(g[k]={n:0,ms:0,d:0,cn:q.cn}));g[k].n++;if(q.ms)g[k].ms++;if(q.dia)g[k].d++;});
      return Object.entries(g).sort().map(([k,r])=>`<tr><td>${k.split("/")[0]}</td>
        <td>Paper ${k.split("/")[1]} · ${esc(r.cn||"")}</td><td class="num">${r.n}</td>
        <td class="num">${r.ms}</td><td class="num">${r.d}</td></tr>`).join("");})()}
    </table>
  </div>`;
  $("count").textContent = `${done} / ${QB.length} 做过`;
}

/* ---------------------------------------------------------------- wire --- */
let VIEW = "drill";
function fillSelects(){
  const syls = [...new Set(QB.map(q=>q.s))].sort();
  $("fSyl").innerHTML = `<option value="">全部科目</option>` +
    syls.map(s=>`<option value="${s}">${s}</option>`).join("");
  refreshDependent();
}
function refreshDependent(){
  const s = $("fSyl").value;
  const sub = QB.filter(q => !s || q.s===s);
  const comps = [...new Set(sub.map(q=>q.c))].sort();
  const keepC = $("fComp").value;
  $("fComp").innerHTML = `<option value="">全部试卷</option>` + comps.map(c=>{
    const name = (sub.find(q=>q.c===c)||{}).cn || "";
    return `<option value="${c}">Paper ${c}${name?" · "+name:""}</option>`;
  }).join("");
  if (comps.includes(keepC)) $("fComp").value = keepC;
  const c = $("fComp").value;
  const sub2 = sub.filter(q => !c || q.c===c);
  const tset = {};
  sub2.forEach(q => { if (q.t) tset[q.t] = q.tn; });
  const keepT = $("fTopic").value;
  $("fTopic").innerHTML = `<option value="">全部主题</option>` +
    Object.keys(tset).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))
      .map(t=>`<option value="${t}">${t} ${tset[t]||""}</option>`).join("");
  if (tset[keepT]) $("fTopic").value = keepT;
}
function apply(){
  readFilters();
  LIST = pool(); IDX = 0;
  if (VIEW==="drill") drawDrill();
  else if (VIEW==="paper") drawPaper();
  else drawStats();
}
["fSyl","fComp"].forEach(id => $(id).addEventListener("change", ()=>{refreshDependent(); apply();}));
["fTopic","fState","fMs","fClean","fDia","fShuffle"].forEach(id => $(id).addEventListener("change", apply));
["fMinM","fMaxM","fY0","fY1","fText"].forEach(id => $(id).addEventListener("input", debounce(apply, 250)));
function debounce(fn, ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a), ms);}; }
$("reset").onclick = () => {
  ["fSyl","fComp","fTopic","fState","fMinM","fMaxM","fY0","fY1","fText"].forEach(id=>$(id).value="");
  $("fMs").checked = true; $("fClean").checked = false;
  $("fDia").checked = false; $("fShuffle").checked = true;
  SEED++; refreshDependent(); apply();
};
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  VIEW = b.dataset.v; stopTick();
  [...$("tabs").children].forEach(x => x.classList.toggle("on", x===b));
  $("side").style.display = VIEW==="drill" ? "" : "none";
  document.querySelector("main").classList.toggle("nofilter", VIEW !== "drill");
  apply();
};
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(PROG,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "caie-做题记录.json"; a.click();
};
$("importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try {
      const d = JSON.parse(r.result);
      Object.assign(PROG, d); saveProg(); apply();
      alert("已合并 " + Object.keys(d).length + " 条记录。");
    } catch(err){ alert("这个文件读不出来：" + err.message); } };
  r.readAsText(f);
};
document.addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (VIEW !== "drill") return;
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  else if (e.key === " ") { const d = document.querySelector(".msbox");
                            if (d) d.open = !d.open; e.preventDefault(); }
  else if (e.key === "1" && LIST[IDX]) grade(LIST[IDX].id, "good");
  else if (e.key === "2" && LIST[IDX]) grade(LIST[IDX].id, "ok");
  else if (e.key === "3" && LIST[IDX]) grade(LIST[IDX].id, "bad");
});

if (!QB.length){
  $("view").innerHTML = `<div class="card empty">没读到题库数据。<br>
    请确认 <code>data.js</code> 和这个 html 放在同一个文件夹里。</div>`;
} else {
  fillSelects(); apply();
  window.addEventListener("load", ()=> setTimeout(()=>typeset(document.body), 300));
}
</script>
