<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库数据管理</title>
<link rel="stylesheet" href="/static/ds/tokens.css">
<link rel="stylesheet" href="/static/ds/bundle.css">
<link rel="stylesheet" href="/static/ds/fixes.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
<script>
  // The theme from the settings page: system, light or dark.
  try {
    var t = localStorage.getItem('dm-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
  // In the window on macOS (manage.py window) the page also fills the title bar: the
  // shell leaves its height free for the window buttons, the loader covers it too.
  var tb = /[?&]titlebar=(\d+)/.exec(location.search);
  if (tb) document.documentElement.style.setProperty('--titlebar', tb[1] + 'px');
</script>
</head>
<body>
<div id="boot" class="dm-boot">
  <div class="ldr"><div class="ldr-screen" role="progressbar" aria-label="正在载入" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--p:0">
    <div class="ldr-bar"><i></i></div>
    <div class="ldr-read" aria-hidden="true"><span class="ldr-core"><span><b>0</b><small>%</small></span></span><span class="ldr-deco"></span><span class="ldr-label">正在载入</span></div>
  </div></div>
</div>
<script>
  // The page loader, drawn from the first paint. The reading follows one fixed curve
  // (a gentle ease out over DURATION) whatever the page does: it stops at HOLD until the page
  // reports it is ready (dmBoot.ready()), and from there goes on at the same pace; when it
  // had to wait at HOLD it goes the rest of the way within FINISH. Its clock moves at most
  // STEP per frame, so a frame the browser could not draw in time makes it pause rather than
  // jump. At 100 it plays the exit; work handed to dmBoot.after() runs then, behind the
  // still reading, so it does not stop the reading on its way up.
  (function () {
    var DURATION = 1300, HOLD = 92, FINISH = 400, EXIT = 1600, STEP = 34;
    var box = document.getElementById('boot'), screen = box.querySelector('.ldr-screen'), num = box.querySelector('b');
    var last = 0, clock = 0, ready = false, held = -1, shown = -1, done = false, waiting = [];
    function curve(x) { return 100 * Math.sin(Math.PI / 2 * Math.min(1, Math.max(0, x))); }
    function frame(now) {
      clock += last ? Math.min(STEP, now - last) : 0;
      last = now;
      var p = curve(clock / DURATION);
      if (p >= HOLD && held < 0 && !ready) held = clock;
      if (held >= 0) p = ready ? HOLD + (100 - HOLD) * curve((clock - held) / FINISH) / 100 : HOLD;
      p = Math.floor(p);
      if (p !== shown) { shown = p; screen.style.setProperty('--p', p); screen.setAttribute('aria-valuenow', p); num.textContent = p; }
      if (p < 100) return requestAnimationFrame(frame);
      screen.classList.add('is-leaving');
      box.classList.add('is-leaving');
      setTimeout(function () { box.remove(); }, EXIT);
      requestAnimationFrame(function () { setTimeout(function () { done = true; waiting.splice(0).forEach(function (f) { f(); }); }, 0); });
    }
    requestAnimationFrame(frame);
    window.dmBoot = {
      ready: function () { if (!ready) { ready = true; if (held >= 0) held = clock; } },
      after: function (f) { if (done) f(); else waiting.push(f); },
    };
  })();
</script>
<div id="root"></div>
<script defer src="/static/ds/react.production.min.js"></script>
<script defer src="/static/ds/react-dom.production.min.js"></script>
<script defer src="/static/ds/bundle.js"></script>
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/auto-render.min.js"></script>
<script defer src="/static/app.js"></script>
</body>
</html>
